name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Accuracy check on 100k synthetic documents
        run: |
          recon2b synth --invoices 100000 --out-dir data/ci
          recon2b eval data/ci | tee eval.txt
          python - <<'PY'
          import re
          text = open("eval.txt").read()
          p, r = map(float, re.search(r"precision ([\d.]+)%\s+recall ([\d.]+)%", text).groups())
          assert p >= 99.9 and r >= 99.5, f"accuracy dropped: precision {p}% recall {r}%"
          PY
