[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "recon2b"
version = "0.1.0"
description = "Reconcile a purchase register against GSTR-2B and find the input tax credit at risk"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vinayak Kothari" }]
keywords = ["gst", "gstr-2b", "reconciliation", "itc", "accounting", "india"]
dependencies = [
  "polars>=1.0",
  "numpy>=1.24",
  "rapidfuzz>=3.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "typer>=0.12",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
recon2b = "recon2b.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recon2b"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["recon2b", "conftest"]
